name: CI

on:
  push:
    branches: [main]

jobs:
  build:
    name: Build internal + external APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools: latest
          platforms: 'android-35'
          build-tools: '35.0.0'

      - name: Install android workload
        run: dotnet workload install android

      # 装配资产：前端 dist + Termux bootstrap + 内置 4×JDK（internal）
      - name: Assemble assets (web + termux + jdk)
        run: |
          chmod +x scripts/assemble-assets.sh
          ./scripts/assemble-assets.sh --jdk

      # 两个 flavor 产物同名，用独立 OutputPath 隔离；构建间清 obj 防止资产打包缓存串味
      - name: Build internal APK
        run: dotnet build src/MSMC.Android/MSMC.Android.csproj -c Release -p:AppFlavor=internal -p:AndroidKeyStore=false -p:OutputPath=bin/Release/internal/

      - name: Clean obj (flavor-isolated asset packaging)
        run: rm -rf src/MSMC.Android/obj src/MSMC.Shared/obj

      - name: Build external APK
        run: dotnet build src/MSMC.Android/MSMC.Android.csproj -c Release -p:AppFlavor=external -p:AndroidKeyStore=false -p:OutputPath=bin/Release/external/

      # 协议级烟雾测试（WebPanel，无需 root）
      - name: Run WebPanel smoke test
        run: dotnet run --project tests/MSMC.Android.Tests -c Release

      - name: Upload internal APK
        uses: actions/upload-artifact@v4
        with:
          name: msmc-android-internal
          path: src/MSMC.Android/bin/Release/internal/*-Signed.apk
          if-no-files-found: error

      - name: Upload external APK
        uses: actions/upload-artifact@v4
        with:
          name: msmc-android-external
          path: src/MSMC.Android/bin/Release/external/*-Signed.apk
          if-no-files-found: error