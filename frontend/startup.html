<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MSMC 启动中</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background-color: #020617; -webkit-user-select: none; user-select: none; }
      body { font-family: "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif; color: #e2e8f0; overflow: hidden; }
      #root { height: 100%; }
      #boot-diagnostics {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at center, #0a0f1e 0%, #020617 100%); color: #e2e8f0; padding: 24px; z-index: 9999;
        font-size: 13px; line-height: 1.6;
        /* 过渡：避免 React 挂载前生硬移除 */
        transition: opacity 400ms cubic-bezier(0.33, 1, 0.68, 1);
        opacity: 1;
      }
      #boot-diagnostics.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #boot-diagnostics .box { max-width: 480px; width: 100%; background: rgba(15,23,42,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(59,130,246,0.15); border-radius: 12px; padding: 20px; box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 0 40px rgba(59,130,246,0.05); }
      #boot-diagnostics h2 { margin: 0 0 8px; font-size: 14px; color: #60a5fa; font-weight: 600; letter-spacing: 0.08em; text-shadow: 0 0 10px rgba(96,165,250,0.3); }
      #boot-diagnostics .log { margin-top: 12px; padding: 10px; background: rgba(2,6,23,0.5); border-radius: 6px; font-family: Consolas, monospace; font-size: 11px; color: #94a3b8; max-height: 160px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot-diagnostics">
      <div class="box">
        <h2>MSMC 启动中...</h2>
        <div class="log" id="boot-log">[BOOT] 正在加载启动界面...</div>
      </div>
    </div>
    <script>
      (function () {
        var bootLog = document.getElementById('boot-log');
        function appendLog(msg) {
          if (bootLog) {
            var line = '[' + new Date().toLocaleTimeString() + '] ' + msg + '\n';
            bootLog.textContent += line;
          }
        }
        window.addEventListener('error', function (e) {
          var msg = (e.message || '未知错误') + (e.filename ? ' @ ' + e.filename + ':' + (e.lineno || 0) + ':' + (e.colno || 0) : '');
          appendLog('[ERROR] ' + msg);
        });
        window.addEventListener('unhandledrejection', function (e) {
          var reason = e.reason;
          var msg = (reason && (reason.message || reason.toString())) || '未处理的 Promise 拒绝';
          appendLog('[PROMISE] ' + msg);
        });
        appendLog('[BOOT] 启动诊断脚本已就绪');
      })();
    </script>
    <script type="module" src="/src/startup.tsx"></script>
  </body>
</html>
